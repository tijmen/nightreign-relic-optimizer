# list one here only to override that.
# Unlisted IDs score 0 and are reported; `--sync` appends them here.
# Game rules (alias IDs, rally tiers, effects that don't stack with each other, derived damage values)
# live in rules.py; the editor shows them on each row.
# ============================================================================

