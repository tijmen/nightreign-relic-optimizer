# Guardian relic preferences.  Edit this file (or use relic_ui.py), then:
#     uv run relic_opt.py all_relics_exported_YYYYMMDD.xlsx --character Guardian
# Weights are "points"; only their relative size matters.
# Starting defaults (2026-10-27): Raider's generic weights, adjusted for Guardian - tank/support: halberd + greatshield, guarding and guard counters, Whirlwind skill, Wings of Salvation art.
# Character effects, weapon classes, stats and spells were set for this profile; tune to taste.

character = "Guardian"        # effects tagged for other characters score 0
curse_count_penalty = -1      # extra points per curse of any kind (you want few curses)
unknown_curse_weight = -5     # curses not listed in [curses] (until you run --sync and set them)
top = 10                      # builds to print overall
per_vessel = 1                # also print the best N builds for each vessel

# ----------------------------------------------------------------------------
# Vessels.  Colors: R G B Y, W = any color.  `normal` = slots 1-3, `deep` = slots 4-6.
# Comment one out (#) to exclude it from the search.
# ----------------------------------------------------------------------------
vessels = [
  { name = "Guardian's Urn",              normal = "RYY", deep = "RYY" },
  { name = "Guardian's Goblet",           normal = "BBG", deep = "BBG" },
  { name = "Guardian's Chalice",          normal = "BYW", deep = "RBY" },
  { name = "Sealed Guardian's Urn",       normal = "YYR", deep = "GGB" },
  { name = "Soot-Covered Guardian's Urn", normal = "RGG", deep = "RGG" },
  { name = "Giant's Cradle Grail",        normal = "BBB", deep = "BBB" },
  { name = "Sacred Erdtree Grail",        normal = "YYY", deep = "YYY" },
  { name = "Spirit Shelter Grail",        normal = "GGG", deep = "GGG" },
  { name = "Decrepit Goblet",             normal = "YGG", deep = "YGG" },
  { name = "Forgotten Goblet",            normal = "GBB", deep = "RBW" },
  { name = "Sacdutree Grail",             normal = "RRR", deep = "RRR" },
]

# ----------------------------------------------------------------------------
# Damage model: how damage effects are valued (see rules.py). 1 point = `points_per_pct_damage` per 1% damage.
# Physical Attack Up tiers, Improved Melee Attack Power, Strength +n and Strength curses are computed from this
# (Strength from the game's stat-scaling data for `weapon`), so their lines aren't in the tables below.
# level_weights: how much each character level counts (e.g. boss fights at ~9, ~13 and 15).
# two_handed: share of damage dealt two-handing (0 = always one-handed, 1 = always two-handed).
# ----------------------------------------------------------------------------
[damage_model]
points_per_pct_damage = 0.8
weapon = "Guardian's Halberd"
two_handed = 0.2
level_weights = { 1 = 1, 2 = 1, 3 = 1, 4 = 1, 5 = 1, 6 = 1, 7 = 1, 8 = 1, 9 = 1, 10 = 1, 11 = 1, 12 = 1, 13 = 1, 14 = 1, 15 = 1 }

# ============================================================================
